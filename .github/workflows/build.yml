name: Go

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build
    strategy:
      matrix:
        go: ["1.25", "1.26"]
    runs-on: ubuntu-latest
    container: golang:${{ matrix.go }}-bookworm
    steps:
    - run: go install golang.org/x/tools/cmd/goimports@latest
    - uses: actions/checkout@v4
    - run: ./gotest.sh
