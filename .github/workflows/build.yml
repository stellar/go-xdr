name: Go

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    strategy:
      matrix:
        go: ["1.25", "1.26"]
    runs-on: ubuntu-latest
    container: golang:${{ matrix.go }}-bookworm
    steps:
    - run: go install golang.org/x/tools/cmd/goimports@latest
    - uses: actions/checkout@v4
    - run: ./gotest.sh

  complete:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
